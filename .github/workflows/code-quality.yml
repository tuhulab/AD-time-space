name: Code Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.2.0'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
        
    - name: Install R dependencies
      run: |
        Rscript -e "install.packages(c('lintr', 'renv'), repos='https://cloud.r-project.org/')"
        
    - name: Run lintr
      run: |
        Rscript -e "
        library(lintr)
        lint_results <- lint_dir('R')
        print(lint_results)
        if (length(lint_results) > 0) {
          cat('::warning::Found', length(lint_results), 'linting issues\n')
        }
        "
        
    - name: Check code quality score
      run: |
        Rscript check_code_quality.R || echo "Quality check completed"
        
    - name: Upload quality report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-report
        path: |
          code_quality_report.rds
          code_quality_score.txt
